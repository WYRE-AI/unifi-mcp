services:
  # Gateway mode. The UniFi API key arrives per request on X-UniFi-Api-Key.
  # Do not set UNIFI_API_KEY or env_file here — that would put a static vendor
  # credential in the container. For AUTH_MODE=env, pass UNIFI_API_KEY on that
  # process instead (see the README).
  unifi-mcp:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
